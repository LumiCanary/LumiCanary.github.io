<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Everything Is Fine · After</title>
    <style>:root{--bg:#f7e4ef;--fg:#49354b}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;min-height:100vh;background:var(--bg);color:var(--fg)}nav{display:flex;gap:18px;flex-wrap:wrap;padding:24px;font:14px system-ui}a{color:inherit}main{max-width:850px;margin:8vh auto;padding:24px}h1{font-size:clamp(48px,10vw,100px);margin:0 0 20px}p{font-size:20px;line-height:1.7}button,input,textarea{font:inherit;padding:14px;border:1px solid currentColor;border-radius:8px}button{cursor:pointer;background:transparent;color:inherit;margin:8px 8px 8px 0}textarea{display:block;width:100%;min-height:130px;background:#ffffffaa;color:#222}button:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:5px}.note{font:14px/1.6 system-ui;opacity:.75}#result{min-height:70px;padding:20px 0}footer{padding:24px;font:14px/1.6 system-ui} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
  <main><h1>Everything<br>is fine.</h1>
    <p>A perfectly ordinary page. Nothing to see here.</p>
    <button id="fine">Everything is fine</button>
    <button id="reset">Start again</button>
    <div id="result" role="status" aria-live="polite">
    </div>
  </main>
   <script>let n=0;const b=document.querySelector('#fine'),r=document.querySelector('#result');b.onclick=()=>{n++;r.textContent=['A tiny error. Probably nothing.','That error has been successfully ignored.','Everything is fine. Everything is fine.','You do not have to pretend here.'][Math.min(n-1,3)];b.style.fontSize=Math.min(16+n*5,56)+'px';document.querySelector('h1').style.letterSpacing=(n%3)*3+'px'};document.querySelector('#reset').onclick=()=>{n=0;r.textContent='';b.style.fontSize='';document.querySelector('h1').style.letterSpacing=''};</script></body></html>
