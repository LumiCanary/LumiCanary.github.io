<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>If Only · After</title><style>:root{--bg:#eee7d7;--fg:#443e53}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;min-height:100vh;background:var(--bg);color:var(--fg)}nav{display:flex;gap:18px;flex-wrap:wrap;padding:24px;font:14px system-ui}a{color:inherit}main{max-width:850px;margin:8vh auto;padding:24px}h1{font-size:clamp(48px,10vw,100px);margin:0 0 20px}p{font-size:20px;line-height:1.7}button,input,textarea{font:inherit;padding:14px;border:1px solid currentColor;border-radius:8px}button{cursor:pointer;background:transparent;color:inherit;margin:8px 8px 8px 0}textarea{display:block;width:100%;min-height:130px;background:#ffffffaa;color:#222}button:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:5px}.note{font:14px/1.6 system-ui;opacity:.75}#result{min-height:70px;padding:20px 0}footer{padding:24px;font:14px/1.6 system-ui} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><nav aria-label="Stages"><a href="denial.html">Denial</a><a href="anger.html">Anger</a><a href="bargaining.html">Bargaining</a><a href="depression.html">Depression</a><a href="acceptance.html">Acceptance</a></nav><main><h1>If only.</h1><p id="prompt">Some paths lead back to the same question.</p><div id="choices"></div><div id="result" role="status" aria-live="polite"></div><button id="reset">Return to the beginning</button></main><footer>After — five creative spaces, no required order. This is an art project, not mental-health care. Your writing stays in this browser; nothing is uploaded.</footer><script>const lines=['What if I had stayed?','Maybe if I had called?','What if there had been more time?','Maybe if I had known?','What if I tried again?','Maybe if I found the right words?'];let trail=[];const c=document.querySelector('#choices'),r=document.querySelector('#result');function render(){c.replaceChildren();if(trail.length===3){document.querySelector('#prompt').textContent='The path returns here. You can leave the question unanswered.';r.replaceChildren();trail.forEach(x=>{let p=document.createElement('p');p.textContent=x;r.append(p)});return}document.querySelector('#prompt').textContent='Choose a path through the imagined possibilities.';for(let i=0;i<2;i++){const text=lines[trail.length*2+i];let b=document.createElement('button');b.textContent=text;b.onclick=()=>{trail.push(text);render()};c.append(b)}}document.querySelector('#reset').onclick=()=>{trail=[];r.replaceChildren();render()};render();</script></body></html>
