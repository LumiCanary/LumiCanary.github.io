<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    "
  >

  <title>Still here.</title>

  <style>
    :root {
      --bg: #e9efdf;
      --fg: #354b37;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8vh 7vw;
      font: 20px/1.6 Georgia, serif;
      background: var(--bg);
      color: var(--fg);
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      font-size: clamp(45px, 9vw, 90px);
      line-height: 1.1;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    button,
    textarea {
      font: inherit;
      padding: 14px;
      border: 1px solid currentColor;
      border-radius: 8px;
    }

    button {
      background: transparent;
      color: inherit;
      cursor: pointer;
      margin: 12px 8px 12px 0;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: #ffffffbb;
      color: #222;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 4px;
    }

    #result p {
      padding: 18px;
      border-bottom: 1px solid currentColor;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    small {
      display: block;
      margin-top: 50px;
      font: 14px/1.6 system-ui, sans-serif;
    }

    .clue {
      color: var(--bg);
    }
  </style>
</head>

<body>
  <main>
    <h1>Still here.</h1>

    <p>Something can grow beside what you carry.</p>

    <label for="text">
      Plant a memory or a small beginning
    </label>

    <textarea
      id="text"
      maxlength="300"
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <button id="go" type="button">Plant this memory</button>
    <button id="reset" type="button">Clear the garden</button>

    <div id="result" role="status" aria-live="polite"></div>

    <small>
      Standalone art project, not mental-health care.
      This page does not save or upload your writing.
      Browser features may retain or restore entered text.
      No shared storage, uploads, or links to other pages.
    </small>

    <section class="clue">
      <h2>D=X</h2>
      <p>xyunb.bngf</p>
      <p>stegthhxdc.wiba</p>
    </section>
  </main>

  <script>
    const go = document.getElementById("go");
    const reset = document.getElementById("reset");
    const text = document.getElementById("text");
    const result = document.getElementById("result");

    go.addEventListener("click", () => {
      const memory = text.value.trim();

      if (!memory) {
        return;
      }

      const paragraph = document.createElement("p");
      paragraph.textContent = "🌱 " + memory;

      result.append(paragraph);
      text.value = "";
      text.focus();
    });

    reset.addEventListener("click", () => {
      text.value = "";
      result.replaceChildren();
      text.focus();
    });
  </script>
</body>
</html>
