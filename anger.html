<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src &#39;none&#39;;
      script-src &#39;unsafe-inline&#39;;
      style-src &#39;unsafe-inline&#39;;
      connect-src &#39;none&#39;;
      frame-src &#39;none&#39;;
      object-src &#39;none&#39;;
      base-uri &#39;none&#39;;
      form-action &#39;none&#39;;
    "
  >

  <title>Rage room.</title>

  <style>
    :root {
      --bg: #21171b;
      --fg: #ff8b7b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8vh 7vw;
      font: 20px/1.6 Georgia, serif;
      background: var(--bg);
      color: var(--fg);
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      font-size: clamp(45px, 9vw, 90px);
      line-height: 1.1;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    button,
    textarea {
      font: inherit;
      padding: 14px;
      border: 1px solid currentColor;
      border-radius: 8px;
    }

    button {
      background: transparent;
      color: inherit;
      cursor: pointer;
      margin: 12px 8px 12px 0;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 160px;
      resize: vertical;
      background: #ffffffbb;
      color: #222;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 4px;
    }

    #result:not(:empty) {
      padding: 18px;
      border-bottom: 1px solid currentColor;
    }

    small {
      display: block;
      margin-top: 50px;
      font: 14px/1.6 system-ui, sans-serif;
    }

    .clue {
      color: var(--bg);
    }
  </style>
</head>

<body>
  <main>
    <h1>Rage room.</h1>
    <p>Some words are for expressing, not sending.</p>
    <section class="clue">
      <h2>T=B</h2>
      <p>tsjysafafy.zled</p>
    </section>
    <label for="text">Write an unsent message</label>
    <textarea
      id="text"
      autocomplete="off"
      spellcheck="false"
    ></textarea>

    <button id="go" type="button">Shred the message</button>
    <button id="smash" type="button">Smash a button</button>

    <div id="result" role="status" aria-live="polite"></div>

    <small>
      Standalone art project, not mental-health care.
      This page does not save or upload your writing.
      Shredding clears the text box; it is not secure erasure.
      Browser features may retain or restore entered text.
      No shared storage, uploads, or links to other pages.
    </small>

  </main>

  <script>
    const go = document.getElementById("go");
    const text = document.getElementById("text");
    const result = document.getElementById("result");
    const smash = document.getElementById("smash");

    let n = 0;

    go.addEventListener("click", () => {
      text.value = "";
      result.textContent = "Message cleared. Nothing was sent.";
    });

    smash.addEventListener("click", () => {
      n += 1;

      const count = n === 1
        ? "1 button broken."
        : n + " buttons broken.";

      result.textContent =
        "▧ ▪ ▫ ▴ ▪ ▧ — " +
        count +
        " You can pause whenever you want.";
    });
  </script>
</body>
</html>
    '
  ></iframe>
</body>
</html>
